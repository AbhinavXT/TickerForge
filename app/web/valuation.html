<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>TickerForge · Valuation</title>
		<meta name="theme-color" content="#0b0e13" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
		<link rel="stylesheet" href="/app.css" />
		<script src="/ui.js"></script>
		<style>
			.assume { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) auto; gap: var(--s3); align-items: end; }
			.assume input { width: 100%; }
			.vtbl th.sortable { cursor: pointer; user-select: none; }
			.vtbl th.sortable:hover { color: var(--text); }
			.vtbl th[aria-sort] { color: var(--text); }
			.vtbl td.stk .nm { color: var(--text-3); font-size: var(--fs-11); font-family: var(--sans); max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
			.vtbl td.stk b { font-family: var(--mono); font-weight: 500; }
			.verdict { font-size: var(--fs-11); }
			/* drawer content */
			.vd h3 { font-size: var(--fs-13); font-weight: 600; margin: var(--s5) 0 var(--s2); display: flex; align-items: center; gap: var(--s2); }
			.vd .note { color: var(--text-3); font-size: var(--fs-12); margin-top: var(--s2); line-height: 1.55; }
			.mbars { display: flex; flex-direction: column; gap: 6px; }
			.mbar { display: grid; grid-template-columns: 150px minmax(0, 1fr) 92px; gap: var(--s2); align-items: center; font-size: var(--fs-12); }
			.mbar .lab { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
			.mbar .track { position: relative; height: 14px; background: var(--surface-3); border-radius: 3px; }
			.mbar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: color-mix(in srgb, var(--bull) 55%, transparent); }
			.mbar .fill.below { background: color-mix(in srgb, var(--bear) 55%, transparent); }
			.mbar .px { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); }
			.mbar .val { text-align: right; font-family: var(--mono); }
			.mbar .val small { display: block; font-size: var(--fs-11); }
			.callout { background: var(--surface-1); border: 1px solid var(--border); border-left: 3px solid var(--violet); border-radius: var(--radius-sm); padding: var(--s3) var(--s4); }
			.callout .big { font: 500 var(--fs-24)/1.2 var(--mono); }
			.scen { position: relative; height: 36px; margin: var(--s6) var(--s2) var(--s1); }
			.scen .line { position: absolute; left: 0; right: 0; top: 17px; height: 2px; background: var(--surface-3); border-radius: 1px; }
			.scen .rng { position: absolute; top: 15px; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--violet) 40%, transparent); }
			.scen .dot { position: absolute; top: 11px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 2px solid var(--surface-2); }
			.scen .dot.bear { background: var(--bear); } .scen .dot.base { background: var(--text-2); } .scen .dot.bull { background: var(--bull); }
			.scen .px { position: absolute; top: 2px; bottom: 2px; width: 2px; margin-left: -1px; background: var(--text); }
			.scen .pxl { position: absolute; top: -14px; transform: translateX(-50%); font: var(--fs-11)/1 var(--mono); color: var(--text-2); white-space: nowrap; }
			.scenrows { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); }
			.sens { border-collapse: separate; border-spacing: 2px; width: 100%; font-family: var(--mono); font-size: var(--fs-12); }
			.sens th { color: var(--text-3); font-weight: 400; padding: 4px; text-align: center; font-size: var(--fs-11); }
			.sens td { text-align: center; padding: 6px 4px; border-radius: 4px; color: var(--text); }
			.sens td .u { font-size: var(--fs-11); color: var(--text-2); }
			.sens td.base { outline: 1.5px solid var(--text); outline-offset: -1.5px; }
			.qgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); }
			.hist { position: relative; height: 10px; background: var(--surface-3); border-radius: 5px; margin: var(--s4) 0 var(--s2); }
			.hist .med { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text-3); }
			.hist .cur { position: absolute; top: -5px; width: 12px; height: 20px; margin-left: -6px; border-radius: 3px; background: var(--violet); }
			@media (max-width: 1099px) { .assume { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
			@media (max-width: 759px) {
				.assume { grid-template-columns: repeat(2, minmax(0, 1fr)); }
				.assume #run { grid-column: 1 / -1; }
				.mbar { grid-template-columns: 96px minmax(0, 1fr) 76px; }
				.qgrid, .scenrows { grid-template-columns: minmax(0, 1fr); }
			}
		</style>
	</head>
	<body>
		<div id="nav" data-page="valuation">
			<span class="brand">TickerForge</span>
			<a class="tab" href="/board">Board</a>
			<a class="tab" href="/">Chart</a>
			<a class="tab" href="/desk">Desk</a>
			<a class="tab" href="/scanner">Scanner</a>
			<a class="tab" href="/screen">Screen</a>
			<a class="tab" href="/query">Query</a>
			<a class="tab" href="/fundamentals">Fundamentals</a>
			<a class="tab" href="/results">Results</a>
			<a class="tab on" href="/valuation">Valuation</a>
			<a class="tab" href="/metrics">Metrics</a>
			<a class="tab" href="/news">News</a>
			<a class="tab" href="/actions">Corporate Actions</a>
			<a class="tab" href="/portfolio">Portfolio</a>
			<a class="tab" href="/paper">Paper</a>
			<a class="tab" href="/journal">Journal</a>
			<a class="tab" href="/backtest">Backtest</a>
			<a class="tab" href="/settings">Settings</a>
			<span class="sp"></span>
			<span class="status" id="status"></span>
		</div>
		<script>TF.shell()</script>
		<div class="wrap">
			<div class="page-head">
				<div>
					<h2 class="page">Valuation screener</h2>
					<div class="sub">Damodaran-flavoured intrinsic value across your watchlist · <a href="/metrics">what do these mean?</a></div>
				</div>
			</div>

			<div class="card assume">
				<label class="field"><span>Cost of equity (rₑ)</span><input id="a_re" type="number" step="0.005" value="0.12" /></label>
				<label class="field"><span>Terminal growth</span><input id="a_gt" type="number" step="0.005" value="0.05" /></label>
				<label class="field"><span>High-growth years</span><input id="a_yr" type="number" step="1" value="10" /></label>
				<label class="field"><span>Growth cap</span><input id="a_gc" type="number" step="0.01" value="0.18" /></label>
				<label class="field"><span>AAA bond yield</span><input id="a_by" type="number" step="0.005" value="0.072" /></label>
				<button type="button" class="btn primary" id="run">Run screen</button>
			</div>
			<div class="sub" id="meta" style="margin: var(--s3) 0 var(--s2)"></div>

			<div class="tbl-wrap" id="tblwrap">
				<table class="tbl vtbl" id="tbl">
					<thead></thead>
					<tbody></tbody>
				</table>
			</div>
			<div id="empty" style="display: none"></div>
		</div>

		<script>
			"use strict"
			const $ = (s) => document.querySelector(s)
			const status = (m) => {
				$("#status").textContent = m || ""
			}
			const esc = TF.esc
			const f = (v, d = 2) =>
				v == null
					? "—"
					: (+v).toLocaleString("en-IN", { maximumFractionDigits: d })
			let rows = [],
				sortKey = "mos_pct",
				sortDir = -1,
				drawer = null

			function assumptions() {
				return {
					re: +$("#a_re").value,
					g_term: +$("#a_gt").value,
					years: +$("#a_yr").value,
					g_cap: +$("#a_gc").value,
					bondY: +$("#a_by").value,
				}
			}
			function qs(a) {
				return Object.entries(a)
					.map(([k, v]) => `${k}=${v}`)
					.join("&")
			}
			// verdict → chip colour (colour carries meaning; the word is always shown)
			const VCLS = { undervalued: "bull", fair: "", rich: "warn", overvalued: "bear" }
			const verdictChip = (v) => `<span class="chip verdict ${VCLS[v] ?? ""}">${esc(v || "n/a")}</span>`

			const COLS = [
				["symbol", "Stock", 0],
				["price", "Price", 1],
				["pe", "P/E", 1],
				["roe", "ROE%", 1],
				["g_used_pct", "g used%", 1],
				["composite", "Intrinsic", 1],
				["mos_pct", "MoS%", 1],
				["verdict", "Verdict", 0],
			]

			async function run() {
				status("valuing…")
				$("#run").disabled = true
				$("#tbl tbody").innerHTML = Array.from({ length: 8 }, () => `<tr>${COLS.map(() => `<td><span class="skel"></span></td>`).join("")}</tr>`).join("")
				try {
					const r = await fetch("/api/valuation/screen?" + qs(assumptions()))
					const d = await r.json()
					if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`)
					rows = d.rows || []
					$("#meta").innerHTML =
						`<span class="mono">${rows.length}</span> valued` +
						(d.missing && d.missing.length
							? ` · ${d.missing.length} without fundamentals (${esc(d.missing.slice(0, 6).join(", "))}${d.missing.length > 6 ? "…" : ""})`
							: "") + " · click a row for the deep view"
					if (!rows.length) {
						$("#tblwrap").style.display = "none"
						$("#empty").style.display = "block"
						$("#empty").innerHTML = TF.empty(
							"No stocks could be valued",
							"Add stocks to your watchlist and fetch their fundamentals first (Fundamentals → Fetch from screener.in).",
							"valuation",
						)
					} else {
						$("#tblwrap").style.display = ""
						$("#empty").style.display = "none"
						draw()
					}
					status("")
				} catch (e) {
					status("error")
					$("#tbl tbody").innerHTML = ""
					$("#empty").style.display = "block"
					$("#empty").innerHTML = ""
					$("#empty").appendChild(TF.errorBox(`Couldn't run the screen: ${e.message}`, run))
				} finally {
					$("#run").disabled = false
				}
			}

			function draw() {
				rows.sort((a, b) => {
					const x = a[sortKey],
						y = b[sortKey]
					if (x == null) return 1
					if (y == null) return -1
					return (x > y ? 1 : x < y ? -1 : 0) * sortDir
				})
				$("#tbl thead").innerHTML =
					"<tr>" +
					COLS.map(
						([k, l, num]) =>
							`<th class="sortable${num ? " num" : ""}" data-k="${k}" tabindex="0"${k === sortKey ? ` aria-sort="${sortDir < 0 ? "descending" : "ascending"}"` : ""}>${l}${k === sortKey ? (sortDir < 0 ? " ▾" : " ▴") : ""}</th>`,
					).join("") +
					"</tr>"
				$("#tbl thead")
					.querySelectorAll("th")
					.forEach((th) => {
						const go = () => {
							const k = th.dataset.k
							if (k === sortKey) sortDir *= -1
							else {
								sortKey = k
								sortDir = k === "symbol" ? 1 : -1
							}
							draw()
						}
						th.onclick = go
						th.onkeydown = (e) => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), go())
					})
				$("#tbl tbody").innerHTML = rows
					.map(
						(r) => `<tr class="click" data-s="${esc(r.symbol)}" tabindex="0">
      <td class="stk"><b>${esc(r.symbol)}</b><div class="nm">${esc((r.name || "").slice(0, 32))}</div></td>
      <td class="num">${f(r.price)}</td><td class="num">${f(r.pe, 1)}</td><td class="num">${f(r.roe, 1)}</td>
      <td class="num">${f(r.g_used_pct, 1)}</td><td class="num">${f(r.composite)}</td>
      <td class="num">${TF.delta(r.mos_pct, 1)}</td>
      <td>${verdictChip(r.verdict)}</td></tr>`,
					)
					.join("")
				$("#tbl tbody")
					.querySelectorAll("tr")
					.forEach((tr) => {
						tr.onclick = () => openDrawer(tr.dataset.s)
						tr.onkeydown = (e) => e.key === "Enter" && openDrawer(tr.dataset.s)
					})
			}

			// ------------------------------------------------------------ drawer
			function modelBars(d) {
				const models = Object.entries(d.models || {}).filter(([, v]) => v != null)
				if (!models.length) return '<div class="note">No earnings-based models could run (EPS ≤ 0 or missing).</div>'
				const hi = Math.max(d.price || 0, ...models.map(([, v]) => v)) * 1.08
				const pos = (v) => Math.max(0, Math.min(100, (v / hi) * 100))
				return (
					`<div class="mbars">` +
					models
						.sort((a, b) => b[1] - a[1])
						.map(([k, v]) => {
							const up = d.price ? ((v - d.price) / d.price) * 100 : null
							return `<div class="mbar" title="${esc(k)}: ₹${f(v)}">
        <span class="lab">${esc(k)}</span>
        <span class="track"><span class="fill${d.price && v < d.price ? " below" : ""}" style="width:${pos(v)}%"></span><span class="px" style="left:${pos(d.price)}%"></span></span>
        <span class="val">₹${f(v, 0)}<small>${TF.delta(up, 0)}</small></span></div>`
						})
						.join("") +
					`</div><div class="note">Bars are each model's fair value; the vertical line is today's price (₹${f(d.price)}). Bars past the line suggest upside.</div>`
				)
			}

			function reverseDcf(d) {
				const rd = d.reverse_dcf
				if (rd && rd.implied_growth_pct != null) {
					const demanding = rd.gap_pp != null && rd.gap_pp > 3
					const conservative = rd.gap_pp != null && rd.gap_pp < -3
					const tag = demanding
						? '<span class="chip bear">demanding</span>'
						: conservative
							? '<span class="chip bull">conservative</span>'
							: '<span class="chip">in line</span>'
					return `<h3>Reverse DCF — what the price assumes</h3><div class="callout">
      <div class="row" style="align-items:baseline"><span class="big">${f(rd.implied_growth_pct, 1)}%</span><span class="sub">implied EPS growth</span><span class="spacer"></span>${tag}</div>
      <div class="sub" style="margin-top:4px">vs <span class="mono">${f(rd.hist_growth_pct, 1)}%</span> historical${rd.gap_pp != null ? ` · gap <span class="mono">${TF.signed(rd.gap_pp, 1, "pp")}</span>` : ""}</div>
      <div class="note">If the market's baked-in growth looks unreachable, the stock is priced for perfection; if it's below what the business has delivered, expectations are modest.</div></div>`
				}
				if (rd && rd.note) return `<h3>Reverse DCF</h3><div class="callout"><div class="sub">${esc(rd.note)}</div></div>`
				return ""
			}

			function scenarios(d) {
				if (!d.scenarios) return ""
				const order = ["bear", "base", "bull"]
				const sc = order.map((k) => [k, d.scenarios[k]]).filter(([, s]) => s && s.fair != null)
				if (!sc.length) return ""
				const vals = sc.map(([, s]) => s.fair).concat(d.price ? [d.price] : [])
				const lo = Math.min(...vals) * 0.92,
					hi = Math.max(...vals) * 1.05
				const sp = (v) => ((v - lo) / (hi - lo)) * 100
				const fair = sc.map(([, s]) => s.fair)
				return (
					`<h3>Scenarios</h3><div class="scen" role="img" aria-label="Bear, base and bull fair values against today's price">
        <div class="line"></div>
        <div class="rng" style="left:${sp(Math.min(...fair))}%;width:${sp(Math.max(...fair)) - sp(Math.min(...fair))}%"></div>
        ${d.price ? `<div class="px" style="left:${sp(d.price)}%"></div><div class="pxl" style="left:${sp(d.price)}%;transform:translateX(${sp(d.price) < 12 ? "0" : sp(d.price) > 88 ? "-100%" : "-50%"})">price ${f(d.price, 0)}</div>` : ""}
        ${sc.map(([k, s]) => `<div class="dot ${k}" style="left:${sp(s.fair)}%" title="${k}: ₹${f(s.fair)}"></div>`).join("")}
      </div><div class="scenrows">` +
					sc
						.map(
							([k, s]) => `<div class="stat"><div class="k">${k === "bull" ? "▲ " : k === "bear" ? "▼ " : "■ "}${k}</div>
          <div class="v">₹${f(s.fair, 0)}</div>
          <div class="c">g ${f(s.g_pct, 0)}% · rₑ ${f(s.re_pct, 1)}% · MoS ${TF.delta(s.mos_pct, 0)}</div></div>`,
						)
						.join("") +
					`</div>`
				)
			}

			// Sequential single-hue scale: one colour, opacity by upside rank.
			// Not red→green: the signed % in each cell carries the direction.
			function sensitivity(d) {
				if (!d.sensitivity || !d.sensitivity.grid) return ""
				const S = d.sensitivity
				const ups = S.grid.flat().filter((c) => c && c.upside_pct != null).map((c) => c.upside_pct)
				const lo = Math.min(...ups),
					hi = Math.max(...ups)
				const re0 = (d.assumptions?.re || 0) * 100
				const reIdx = S.re_axis_pct.reduce((bi, r, i, a) => (Math.abs(r - re0) < Math.abs(a[bi] - re0) ? i : bi), 0)
				const gIdx = S.g_axis_pct.reduce((bi, g, i, a) => (Math.abs(g - d.g_used_pct) < Math.abs(a[bi] - d.g_used_pct) ? i : bi), 0)
				const cell = (c, i, j) => {
					if (!c || c.upside_pct == null) return "<td>—</td>"
					const t = hi > lo ? (c.upside_pct - lo) / (hi - lo) : 0.5
					const pct = Math.round(6 + t * 54)
					const base = i === gIdx && j === reIdx ? " base" : ""
					return `<td class="${base.trim()}" style="background:color-mix(in srgb, var(--bull) ${pct}%, transparent)" title="fair ₹${f(c.fair, 0)} · upside ${TF.signed(c.upside_pct, 0, "%")}">${f(c.fair, 0)}<div class="u">${TF.signed(c.upside_pct, 0, "%")}</div></td>`
				}
				return `<h3>Sensitivity — fair value &amp; upside</h3>
      <div style="overflow-x:auto"><table class="sens"><thead><tr><th>g ╲ rₑ</th>${S.re_axis_pct.map((r) => `<th>${f(r, 1)}%</th>`).join("")}</tr></thead>
      <tbody>${S.grid.map((row, i) => `<tr><th>${f(S.g_axis_pct[i], 0)}%</th>${row.map((c, j) => cell(c, i, j)).join("")}</tr>`).join("")}</tbody></table></div>
      <div class="note">Rows are the high-growth rate, columns the discount rate. Deeper shade = more upside; the outlined cell is closest to the current assumptions.</div>`
			}

			function quality(d) {
				if (!d.quality || !Object.keys(d.quality).length) return ""
				const q = d.quality
				const chips = []
				if (q.roic_pct != null) {
					const good = q.roic_vs_re_pp != null && q.roic_vs_re_pp > 0
					chips.push(`<div class="stat"><div class="k">ROIC</div><div class="v">${f(q.roic_pct, 1)}%</div>
          <div class="c">${q.roic_vs_re_pp != null ? `<span class="chip ${good ? "bull" : "bear"}">${good ? "▲" : "▼"} ${TF.signed(q.roic_vs_re_pp, 1, "pp")} vs rₑ</span>` : ""}</div></div>`)
				}
				if (q.f_score != null) {
					const good = q.f_score >= 7,
						bad = q.f_score <= 3
					chips.push(`<div class="stat"><div class="k">Piotroski F</div><div class="v">${q.f_score}/${q.f_checked || 9}</div>
          <div class="c"><span class="chip ${good ? "bull" : bad ? "bear" : ""}">${good ? "strong" : bad ? "weak" : "middling"}</span></div></div>`)
				}
				if (q.altman_z != null) {
					const cls = q.altman_zone === "safe" ? "bull" : q.altman_zone === "distress" ? "bear" : "warn"
					chips.push(`<div class="stat"><div class="k">Altman Z</div><div class="v">${f(q.altman_z, 2)}</div>
          <div class="c"><span class="chip ${cls}">${esc(q.altman_zone)}</span></div></div>`)
				}
				if (!chips.length) return ""
				return `<h3>Quality &amp; risk</h3><div class="qgrid">${chips.join("")}</div>
      <div class="note">ROIC above your cost of equity = value creation. F-score is a 9-point fundamental-momentum check (higher is better). Altman Z flags bankruptcy risk (&gt;2.99 safe, &lt;1.81 distress). Scores use whatever line items screener provided.</div>`
			}

			function history(d) {
				if (!d.history || !d.history.pe) return ""
				const pe = d.history.pe
				const span = Math.max(pe.max - pe.min, 1e-6)
				const p = (v) => Math.max(0, Math.min(100, ((v - pe.min) / span) * 100))
				return `<h3>Valuation vs its own history</h3>
      <div class="hist"><div class="med" style="left:${p(pe.median)}%" title="median ${pe.median}"></div>
        <div class="cur" style="left:${p(pe.current)}%" title="now ${pe.current}"></div></div>
      <div class="row" style="justify-content:space-between;font:var(--fs-11)/1.4 var(--mono);color:var(--text-3)"><span>${f(pe.min, 1)}</span><span>median ${f(pe.median, 1)}</span><span>${f(pe.max, 1)}</span></div>
      <div class="sub" style="margin-top:6px">P/E now <b class="mono">${f(pe.current, 1)}</b> over ${pe.n}y — <b>${esc(pe.read)}</b> · <span class="mono">${pe.percentile}</span>th percentile</div>`
			}

			async function openDrawer(sym) {
				const r = rows.find((x) => x.symbol === sym)
				if (!r) return
				if (drawer) drawer.close()
				drawer = TF.overlay({
					kind: "drawer",
					title: `${r.symbol}${r.name ? " · " + r.name : ""}`,
					actions: `<a class="btn sm" href="/fundamentals?symbol=${encodeURIComponent(r.symbol)}">Fundamentals</a>`,
					body: `<div class="vd">${TF.skeleton(1, "lg")}<div class="stats">${`<div class="stat">${TF.skeleton(2)}</div>`.repeat(4)}</div>${TF.skeleton(6)}</div>`,
					onClose: () => (drawer = null),
				})
				const mine = drawer
				// pull the rich single-stock view with the current assumptions
				let d = r
				try {
					const res = await fetch(`/api/valuation?symbol=${encodeURIComponent(sym)}&rich=1&` + qs(assumptions()))
					if (res.ok) d = await res.json()
				} catch (e) {}
				if (drawer !== mine) return
				drawer.body.innerHTML = `<div class="vd">
    <div class="stats" style="margin-top:0">
      <div class="stat"><div class="k">Price</div><div class="v">₹${f(d.price)}</div></div>
      <div class="stat"><div class="k">Composite intrinsic</div><div class="v">₹${f(d.composite)}</div><div class="c">median of ${d.n_models ?? "—"} models</div></div>
      <div class="stat"><div class="k">Margin of safety</div><div class="v">${TF.delta(d.mos_pct, 1)}</div><div class="c">${verdictChip(d.verdict)}</div></div>
      <div class="stat"><div class="k">Cost of equity</div><div class="v">${f((d.assumptions?.re || 0) * 100, 1)}%</div><div class="c">${d.assumptions?.re_is_smart ? "smart (size-based)" : "as set"}</div></div>
    </div>
    <h3>Model estimates vs price</h3>
    ${modelBars(d)}
    ${reverseDcf(d)}
    ${scenarios(d)}
    ${sensitivity(d)}
    ${quality(d)}
    ${history(d)}
    <h3>Inputs</h3>
    <div class="tbl-wrap"><table class="tbl">
      <tr><td>EPS (ttm) · BVPS</td><td class="num">${f(d.eps)} · ${f(d.bvps)}</td></tr>
      <tr><td>P/E · ROE · Div yield</td><td class="num">${f(d.pe, 1)} · ${f(d.roe, 1)}% · ${f(d.div_yield, 2)}%</td></tr>
      <tr><td>Growth — historical / used</td><td class="num">${f(d.g_hist_pct, 1)}% / ${f(d.g_used_pct, 1)}%</td></tr>
    </table></div>
    <div class="note">Composite is the <b>median</b> of the models that could run, so one runaway estimate doesn't dominate. Transparent, assumption-driven estimates — not price targets. Tune the assumptions and re-run. See <a href="/metrics">Metrics</a> for what each input means.</div></div>`
			}
			function closeDrawer() {
				if (drawer) drawer.close()
			}

			$("#run").onclick = run
			run()
		</script>
	</body>
</html>
