<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>TickerForge · Valuation</title>
		<link rel="stylesheet" href="/app.css" />
		<style>
			.assume {
				display: flex;
				gap: 14px;
				flex-wrap: wrap;
				align-items: flex-end;
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: 10px;
				padding: 12px 14px;
				margin: 12px 0;
			}
			.assume .fld {
				display: flex;
				flex-direction: column;
				gap: 3px;
			}
			.assume label {
				color: var(--dim);
				font-size: 11px;
			}
			.assume input {
				width: 88px;
				padding: 6px 8px;
				background: var(--bg);
				color: var(--fg);
				border: 1px solid var(--border);
				border-radius: 6px;
				outline: none;
			}
			table.screen {
				width: 100%;
				border-collapse: collapse;
				font-variant-numeric: tabular-nums;
				font-size: 13px;
			}
			table.screen th,
			table.screen td {
				padding: 8px 10px;
				border-bottom: 1px solid var(--border);
				text-align: right;
			}
			table.screen th {
				color: var(--dim);
				font-weight: 500;
				cursor: pointer;
				white-space: nowrap;
				position: sticky;
				top: 0;
				background: var(--bg);
			}
			table.screen td:first-child,
			table.screen th:first-child {
				text-align: left;
				position: sticky;
				left: 0;
				background: var(--bg);
			}
			table.screen tbody tr {
				cursor: pointer;
			}
			table.screen tbody tr:hover td {
				background: var(--panel2);
			}
			.verdict {
				font-size: 11px;
				padding: 1px 8px;
				border-radius: 5px;
				border: 1px solid var(--border);
				white-space: nowrap;
			}
			.verdict.undervalued {
				color: #8fd3c9;
				border-color: #2f5b54;
			}
			.verdict.fair {
				color: #e4c07a;
				border-color: #5b4c2f;
			}
			.verdict.rich {
				color: #e4a58a;
				border-color: #5b3d2f;
			}
			.verdict.overvalued {
				color: #ef8a8a;
				border-color: #5b2f2f;
			}
			.verdict.na {
				color: var(--dim);
			}
			.pos {
				color: var(--up);
			}
			.neg {
				color: var(--down);
			}
			/* detail drawer */
			#drawer {
				position: fixed;
				top: 0;
				right: 0;
				bottom: 0;
				width: min(560px, 94vw);
				background: var(--panel);
				border-left: 1px solid var(--border);
				z-index: 50;
				transform: translateX(100%);
				transition: transform 0.2s;
				overflow-y: auto;
				padding: 18px;
			}
			#drawer.open {
				transform: none;
				box-shadow: -16px 0 40px rgba(0, 0, 0, 0.5);
			}
			#drawer .close {
				position: absolute;
				top: 14px;
				right: 16px;
				cursor: pointer;
				color: var(--dim);
				font-size: 18px;
			}
			#drawer h2 {
				font-size: 18px;
			}
			#drawer .mtable {
				width: 100%;
				border-collapse: collapse;
				margin-top: 10px;
			}
			#drawer .mtable td {
				padding: 7px 8px;
				border-bottom: 1px solid var(--border);
			}
			#drawer .mtable td:last-child {
				text-align: right;
				font-variant-numeric: tabular-nums;
			}
			#drawer .bar2 {
				position: relative;
				height: 26px;
				background: var(--panel2);
				border: 1px solid var(--border);
				border-radius: 6px;
				margin: 14px 0;
				overflow: hidden;
			}
			#drawer .bar2 .pr {
				position: absolute;
				top: 0;
				bottom: 0;
				width: 2px;
				background: var(--fg);
			}
			#drawer .bar2 .cm {
				position: absolute;
				top: 0;
				bottom: 0;
				width: 2px;
				background: var(--accent);
			}
			#drawer .note {
				color: var(--dim);
				font-size: 12px;
				margin-top: 14px;
				line-height: 1.6;
			}
		</style>
	</head>
	<body>
		<div id="nav">
			<span class="brand">TickerForge</span>
			<a class="tab" href="/">Chart</a>
			<a class="tab" href="/desk">Desk</a>
			<a class="tab" href="/portfolio">Portfolio</a>
			<a class="tab" href="/scanner">Scanner</a>
			<a class="tab" href="/screen">Screen</a>
			<a class="tab" href="/query">Query</a>
			<a class="tab" href="/fundamentals">Fundamentals</a>
			<a class="tab" href="/results">Results</a>
			<a class="tab on" href="/valuation">Valuation</a>
			<a class="tab" href="/backtest">Backtest</a>
			<a class="tab" href="/journal">Journal</a>
			<a class="tab" href="/metrics">Metrics</a>
			<a class="tab" href="/paper">Paper</a>
			<a class="tab" href="/news">News</a>
			<a class="tab" href="/actions">Corporate Actions</a>
			<a class="tab" href="/settings">Settings</a>
			<span class="sp"></span>
			<span class="status" id="status"></span>
		</div>
		<div class="wrap">
			<div class="row">
				<h2 class="page">Valuation screener</h2>
				<span class="sub"
					>Damodaran-flavoured intrinsic value across your watchlist ·
					<a href="/metrics">what do these mean?</a></span
				>
			</div>

			<div class="assume">
				<div class="fld">
					<label>Cost of equity (rₑ)</label
					><input id="a_re" type="number" step="0.005" value="0.12" />
				</div>
				<div class="fld">
					<label>Terminal growth</label
					><input id="a_gt" type="number" step="0.005" value="0.05" />
				</div>
				<div class="fld">
					<label>High-growth years</label
					><input id="a_yr" type="number" step="1" value="10" />
				</div>
				<div class="fld">
					<label>Growth cap</label
					><input id="a_gc" type="number" step="0.01" value="0.18" />
				</div>
				<div class="fld">
					<label>AAA bond yield</label
					><input
						id="a_by"
						type="number"
						step="0.005"
						value="0.072"
					/>
				</div>
				<button class="btn primary" id="run">Run screen</button>
				<div class="spacer"></div>
				<div class="sub" id="meta"></div>
			</div>

			<div class="tbl-wrap">
				<table class="screen" id="tbl">
					<thead></thead>
					<tbody></tbody>
				</table>
			</div>
			<div id="empty" class="empty" style="display: none"></div>
		</div>

		<div id="drawer">
			<span class="close" onclick="closeDrawer()">✕</span>
			<div id="dbody"></div>
		</div>

		<script>
			"use strict"
			const $ = (s) => document.querySelector(s)
			const status = (m) => {
				$("#status").textContent = m || ""
			}
			const f = (v, d = 2) =>
				v == null
					? "—"
					: (+v).toLocaleString("en-IN", { maximumFractionDigits: d })
			let rows = [],
				sortKey = "mos_pct",
				sortDir = -1

			function assumptions() {
				return {
					re: +$("#a_re").value,
					g_term: +$("#a_gt").value,
					years: +$("#a_yr").value,
					g_cap: +$("#a_gc").value,
					bondY: +$("#a_by").value,
				}
			}
			function qs(a) {
				return Object.entries(a)
					.map(([k, v]) => `${k}=${v}`)
					.join("&")
			}

			const COLS = [
				["symbol", "Stock", 0],
				["price", "Price", 1],
				["pe", "P/E", 1],
				["roe", "ROE%", 1],
				["g_used_pct", "g used%", 1],
				["composite", "Intrinsic", 1],
				["mos_pct", "MoS%", 1],
				["verdict", "", 0],
			]

			async function run() {
				status("valuing…")
				$("#run").disabled = true
				try {
					const d = await (
						await fetch(
							"/api/valuation/screen?" + qs(assumptions()),
						)
					).json()
					rows = d.rows || []
					$("#meta").textContent =
						`${rows.length} valued` +
						(d.missing && d.missing.length
							? ` · ${d.missing.length} without fundamentals (${d.missing.slice(0, 6).join(", ")}${d.missing.length > 6 ? "…" : ""})`
							: "")
					if (!rows.length) {
						$("#tbl").style.display = "none"
						$("#empty").style.display = "block"
						$("#empty").innerHTML =
							"No stocks could be valued. Add stocks to your watchlist and fetch their fundamentals first (Fundamentals page → Fetch from screener.in)."
					} else {
						$("#tbl").style.display = ""
						$("#empty").style.display = "none"
						draw()
					}
					status("")
				} catch (e) {
					status("error: " + e.message)
				} finally {
					$("#run").disabled = false
				}
			}

			function draw() {
				rows.sort((a, b) => {
					const x = a[sortKey],
						y = b[sortKey]
					if (x == null) return 1
					if (y == null) return -1
					return (x > y ? 1 : x < y ? -1 : 0) * sortDir
				})
				$("#tbl thead").innerHTML =
					"<tr>" +
					COLS.map(
						([k, l]) =>
							`<th data-k="${k}">${l}${k === sortKey ? (sortDir < 0 ? " ▾" : " ▴") : ""}</th>`,
					).join("") +
					"</tr>"
				$("#tbl thead")
					.querySelectorAll("th")
					.forEach(
						(th) =>
							(th.onclick = () => {
								const k = th.dataset.k
								if (k === sortKey) sortDir *= -1
								else {
									sortKey = k
									sortDir = k === "symbol" ? 1 : -1
								}
								draw()
							}),
					)
				$("#tbl tbody").innerHTML = rows
					.map((r) => {
						const mosCls =
							r.mos_pct == null
								? ""
								: r.mos_pct >= 0
									? "pos"
									: "neg"
						return `<tr data-s="${r.symbol}">
      <td>${r.symbol}<div class="sub" style="font-size:11px">${(r.name || "").slice(0, 26)}</div></td>
      <td>${f(r.price)}</td><td>${f(r.pe, 1)}</td><td>${f(r.roe, 1)}</td>
      <td>${f(r.g_used_pct, 1)}</td><td>${f(r.composite)}</td>
      <td class="${mosCls}">${r.mos_pct == null ? "—" : (r.mos_pct > 0 ? "+" : "") + f(r.mos_pct, 1) + "%"}</td>
      <td><span class="verdict ${r.verdict.replace("/", "")}">${r.verdict}</span></td></tr>`
					})
					.join("")
				$("#tbl tbody")
					.querySelectorAll("tr")
					.forEach(
						(tr) => (tr.onclick = () => openDrawer(tr.dataset.s)),
					)
			}

			async function openDrawer(sym) {
				const r = rows.find((x) => x.symbol === sym)
				if (!r) return
				$("#dbody").innerHTML =
					`<h2>${r.symbol}</h2><div class="sub">${r.name || ""}</div><div class="loading">Loading deep view…</div>`
				$("#drawer").classList.add("open")
				// pull the rich single-stock view with the current assumptions
				let d = r
				try {
					d = await (
						await fetch(
							`/api/valuation?symbol=${sym}&rich=1&` +
								qs(assumptions()),
						)
					).json()
				} catch (e) {}
				const models = Object.entries(d.models || {})
				const lo =
					Math.min(
						d.price || 1e9,
						...models.map(([, v]) => v).filter((v) => v),
					) * 0.9
				const hi =
					Math.max(
						d.price || 0,
						...models.map(([, v]) => v).filter((v) => v),
					) * 1.05
				const pos = (v) => ((v - lo) / (hi - lo)) * 100
				const bars = models
					.filter(([, v]) => v != null)
					.map(
						([k, v]) =>
							`<div class="bar2" title="${k}: ${f(v)}"><div class="cm" style="left:${pos(v)}%"></div>
       <div class="pr" style="left:${pos(d.price)}%"></div>
       <div style="position:absolute;left:6px;top:5px;font-size:11px;color:var(--dim)">${k}</div>
       <div style="position:absolute;right:6px;top:5px;font-size:11px">${f(v)}</div></div>`,
					)
					.join("")

				// --- reverse DCF ---
				let revHTML = ""
				const rd = d.reverse_dcf
				if (rd && rd.implied_growth_pct != null) {
					const demanding = rd.gap_pp != null && rd.gap_pp > 3
					const conservative = rd.gap_pp != null && rd.gap_pp < -3
					const tag = demanding
						? '<span class="neg">demanding</span>'
						: conservative
							? '<span class="pos">conservative</span>'
							: "in line"
					revHTML = `<div class="rvblock"><h3>Reverse DCF — what the price assumes</h3>
      <div class="big">${f(rd.implied_growth_pct, 1)}% <span class="sub">implied EPS growth</span></div>
      <div class="sub">vs ${f(rd.hist_growth_pct, 1)}% historical — ${tag}${rd.gap_pp != null ? ` (${rd.gap_pp > 0 ? "+" : ""}${f(rd.gap_pp, 1)}pp)` : ""}</div>
      <div class="note">If the market's baked-in growth looks unreachable, the stock is priced for perfection; if it's below what the business has delivered, expectations are modest.</div></div>`
				} else if (rd && rd.note) {
					revHTML = `<div class="rvblock"><h3>Reverse DCF</h3><div class="sub">${rd.note}</div></div>`
				}

				// --- scenarios ---
				let scHTML = ""
				if (d.scenarios) {
					const order = ["bear", "base", "bull"]
					const fvs = order
						.map((k) => d.scenarios[k]?.fair)
						.filter((v) => v)
					const smin = Math.min(d.price || 1e9, ...fvs) * 0.9,
						smax = Math.max(d.price || 0, ...fvs) * 1.05
					const sp = (v) => ((v - smin) / (smax - smin)) * 100
					scHTML =
						`<h3>Scenarios</h3><div class="scen">` +
						order
							.map((k) => {
								const s = d.scenarios[k]
								if (!s || s.fair == null) return ""
								const cls =
									k === "bull"
										? "pos"
										: k === "bear"
											? "neg"
											: ""
								return `<div class="scenrow"><div class="scenlab ${cls}">${k}</div>
        <div class="track"><div class="mk" style="left:${sp(s.fair)}%"></div>
          <div class="prmk" style="left:${sp(d.price)}%"></div></div>
        <div class="scenval">₹${f(s.fair)} <span class="sub">g ${f(s.g_pct, 0)}% · rₑ ${f(s.re_pct, 1)}% · MoS ${s.mos_pct == null ? "—" : (s.mos_pct > 0 ? "+" : "") + f(s.mos_pct, 0) + "%"}</span></div></div>`
							})
							.join("") +
						`</div><div class="note">▮ marks fair value, │ marks today's price.</div>`
				}

				// --- sensitivity grid ---
				let snHTML = ""
				if (d.sensitivity && d.sensitivity.grid) {
					const S = d.sensitivity
					const cell = (c) => {
						if (!c || c.upside_pct == null) return "<td>—</td>"
						const u = c.upside_pct
						const bg =
							u >= 30
								? "rgba(38,166,154,.35)"
								: u >= 0
									? "rgba(38,166,154,.15)"
									: u >= -25
										? "rgba(239,83,80,.15)"
										: "rgba(239,83,80,.35)"
						return `<td style="background:${bg}" title="upside ${u > 0 ? "+" : ""}${f(u, 0)}%">₹${f(c.fair, 0)}<div class="usub">${u > 0 ? "+" : ""}${f(u, 0)}%</div></td>`
					}
					snHTML = `<h3>Sensitivity — fair value & upside</h3>
      <table class="sens"><thead><tr><th>g ╲ rₑ</th>${S.re_axis_pct.map((r) => `<th>${f(r, 1)}%</th>`).join("")}</tr></thead>
      <tbody>${S.grid.map((row, i) => `<tr><th>${f(S.g_axis_pct[i], 0)}%</th>${row.map(cell).join("")}</tr>`).join("")}</tbody></table>
      <div class="note">Rows = high-growth rate, columns = discount rate. Green where price offers upside to fair value, red where it doesn't.</div>`
				}

				// --- quality / risk ---
				let qHTML = ""
				if (d.quality && Object.keys(d.quality).length) {
					const q = d.quality
					const chips = []
					if (q.roic_pct != null) {
						const good =
							q.roic_vs_re_pp != null && q.roic_vs_re_pp > 0
						chips.push(
							`<div class="qchip ${good ? "pos" : "neg"}"><div class="qv">${f(q.roic_pct, 1)}%</div><div class="ql">ROIC${q.roic_vs_re_pp != null ? ` (${q.roic_vs_re_pp > 0 ? "+" : ""}${f(q.roic_vs_re_pp, 1)} vs rₑ)` : ""}</div></div>`,
						)
					}
					if (q.f_score != null) {
						const good = q.f_score >= 7,
							bad = q.f_score <= 3
						chips.push(
							`<div class="qchip ${good ? "pos" : bad ? "neg" : ""}"><div class="qv">${q.f_score}/${q.f_checked || 9}</div><div class="ql">Piotroski F</div></div>`,
						)
					}
					if (q.altman_z != null) {
						const cls =
							q.altman_zone === "safe"
								? "pos"
								: q.altman_zone === "distress"
									? "neg"
									: ""
						chips.push(
							`<div class="qchip ${cls}"><div class="qv">${f(q.altman_z, 2)}</div><div class="ql">Altman Z · ${q.altman_zone}</div></div>`,
						)
					}
					if (chips.length)
						qHTML = `<h3>Quality & risk</h3><div class="qgrid">${chips.join("")}</div>
      <div class="note">ROIC above your cost of equity = value creation. F-score is a 9-point fundamental-momentum check (higher is better). Altman Z flags bankruptcy risk (&gt;2.99 safe, &lt;1.81 distress). Scores use whatever line items screener provided.</div>`
				}

				// --- history bands ---
				let hHTML = ""
				if (d.history && d.history.pe) {
					const pe = d.history.pe
					const span = Math.max(pe.max - pe.min, 1e-6)
					const p = (v) => ((v - pe.min) / span) * 100
					hHTML = `<h3>Valuation vs its own history</h3>
      <div class="track hist"><div class="band"></div>
        <div class="medmk" style="left:${p(pe.median)}%" title="median ${pe.median}"></div>
        <div class="curmk" style="left:${p(pe.current)}%" title="now ${pe.current}"></div></div>
      <div class="sub">P/E now <b>${f(pe.current, 1)}</b> · median ${f(pe.median, 1)} · range ${f(pe.min, 1)}–${f(pe.max, 1)} (${pe.n}y) — <b>${pe.read}</b> · ${pe.percentile}th pctile</div>
      <div class="note">Where today's P/E sits in the stock's own multi-year range — a mean-reversion read, not a cross-company one.</div>`
				}

				$("#dbody").innerHTML =
					`<h2>${d.symbol}</h2><div class="sub">${d.name || ""}</div>
    <table class="mtable">
      <tr><td>Price</td><td>₹${f(d.price)}</td></tr>
      <tr><td>Composite intrinsic (median)</td><td><b>₹${f(d.composite)}</b></td></tr>
      <tr><td>Margin of safety</td><td class="${d.mos_pct >= 0 ? "pos" : "neg"}">${d.mos_pct == null ? "—" : (d.mos_pct > 0 ? "+" : "") + f(d.mos_pct, 1) + "%"} · ${d.verdict}</td></tr>
      <tr><td>EPS (ttm) · BVPS</td><td>${f(d.eps)} · ${f(d.bvps)}</td></tr>
      <tr><td>P/E · ROE · Div yield</td><td>${f(d.pe, 1)} · ${f(d.roe, 1)}% · ${f(d.div_yield, 2)}%</td></tr>
      <tr><td>Growth — historical / used</td><td>${f(d.g_hist_pct, 1)}% / ${f(d.g_used_pct, 1)}%</td></tr>
      <tr><td>Cost of equity (rₑ)</td><td>${f((d.assumptions?.re || 0) * 100, 1)}%${d.assumptions?.re_is_smart ? " · smart (size-based)" : ""}</td></tr>
    </table>
    ${revHTML}
    ${scHTML}
    ${snHTML}
    ${qHTML}
    ${hHTML}
    <div class="sub" style="margin-top:16px">Model estimates vs price <span style="color:var(--accent)">▮ intrinsic</span> <span>▮ price</span></div>
    ${bars || '<div class="note">No earnings-based models could run (EPS ≤ 0 or missing).</div>'}
    <div class="note">Composite is the <b>median</b> of the models that could run, so one runaway
      estimate doesn't dominate. Transparent, assumption-driven estimates — not price targets. Tune the
      assumptions up top and re-run. See <a href="/metrics">Metrics</a> for what each input means.</div>`
			}
			function closeDrawer() {
				$("#drawer").classList.remove("open")
			}
			document.addEventListener("keydown", (e) => {
				if (e.key === "Escape") closeDrawer()
			})

			$("#run").onclick = run
			run()
		</script>
	</body>
</html>
