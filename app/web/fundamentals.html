<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>TickerForge · Fundamentals</title>
		<link rel="stylesheet" href="/app.css" />
	</head>
	<body>
		<div id="nav">
			<span class="brand">TickerForge</span>
			<a class="tab" href="/">Chart</a>
			<a class="tab" href="/desk">Desk</a>
			<a class="tab" href="/portfolio">Portfolio</a>
			<a class="tab" href="/scanner">Scanner</a>
			<a class="tab" href="/screen">Screen</a>
			<a class="tab" href="/query">Query</a>
			<a class="tab on" href="/fundamentals">Fundamentals</a>
			<a class="tab" href="/results">Results</a>
			<a class="tab" href="/valuation">Valuation</a>
			<a class="tab" href="/backtest">Backtest</a>
			<a class="tab" href="/journal">Journal</a>
			<a class="tab" href="/metrics">Metrics</a>
			<a class="tab" href="/paper">Paper</a>
			<a class="tab" href="/news">News</a>
			<a class="tab" href="/actions">Corporate Actions</a>
			<a class="tab" href="/settings">Settings</a>
			<span class="sp"></span>
			<span class="status" id="status"></span>
		</div>
		<div class="wrap">
			<div class="row">
				<div class="sbox">
					<input
						class="search"
						id="search"
						placeholder="Search a stock… (e.g. tata)"
						autocomplete="off"
					/>
					<div class="sres" id="sres"></div>
				</div>
				<button class="btn" id="refresh" style="display: none">
					Refresh from screener.in
				</button>
				<div class="spacer"></div>
			</div>
			<div id="body"></div>
		</div>

		<script>
			"use strict"
			const $ = (s) => document.querySelector(s)
			const status = (m) => {
				$("#status").textContent = m || ""
			}
			const f = (v) =>
				v == null
					? "—"
					: typeof v === "number"
						? v.toLocaleString("en-IN", {
								maximumFractionDigits: 2,
							})
						: v
			let cur = null // current symbol

			// ---- search ------------------------------------------------------------
			$("#search").addEventListener("input", (e) => {
				clearTimeout(window._d)
				const q = e.target.value.trim()
				if (q.length < 2) {
					$("#sres").classList.remove("open")
					return
				}
				window._d = setTimeout(async () => {
					const rows = await (
						await fetch(`/api/search?q=${encodeURIComponent(q)}`)
					).json()
					$("#sres").innerHTML = rows
						.map(
							(r) =>
								`<div data-s="${r.tradingsymbol}"><span class="sym">${r.tradingsymbol}</span>
       <span class="nm"> · ${r.exchange} · ${r.name || ""}</span></div>`,
						)
						.join("")
					$("#sres").classList.add("open")
					$("#sres")
						.querySelectorAll("div[data-s]")
						.forEach(
							(el) =>
								(el.onclick = () => {
									$("#sres").classList.remove("open")
									$("#search").value = ""
									pick(el.dataset.s)
								}),
						)
				}, 200)
			})
			document.addEventListener("click", (e) => {
				if (!e.target.closest(".sbox"))
					$("#sres").classList.remove("open")
			})

			$("#refresh").onclick = async () => {
				if (!cur) return
				status("refreshing from screener.in…")
				$("#refresh").disabled = true
				try {
					const r = await fetch(
						`/api/fundamentals/refresh?symbol=${cur}`,
						{ method: "POST" },
					)
					if (!r.ok) {
						const e = await r.json().catch(() => ({}))
						status(e.detail || "refresh failed")
					} else await load(cur)
				} finally {
					$("#refresh").disabled = false
				}
			}

			function pick(sym) {
				cur = sym
				history.replaceState(
					null,
					"",
					`/fundamentals?symbol=${encodeURIComponent(sym)}`,
				)
				load(sym)
			}

			// ---- render ------------------------------------------------------------
			async function load(sym) {
				status("loading…")
				$("#body").innerHTML =
					'<div class="loading">loading fundamentals…</div>'
				try {
					const r = await fetch(
						`/api/fundamentals/full?symbol=${encodeURIComponent(sym)}`,
					)
					const d = await r.json()
					if (d.missing) {
						$("#refresh").style.display = ""
						$("#body").innerHTML =
							`<div class="empty">No fundamentals stored for <b>${d.symbol}</b>.<br><br>
         <button class="btn primary" onclick="document.getElementById('refresh').click()">
         Fetch from screener.in</button></div>`
						status("")
						cur = d.symbol
						return
					}
					$("#refresh").style.display = ""
					render(d)
					status("")
				} catch (e) {
					status("error: " + e.message)
					$("#body").innerHTML =
						`<div class="empty">error: ${e.message}</div>`
				}
			}

			function snapNum(snap, ...keys) {
				for (const k of keys) {
					const hit = Object.keys(snap).find(
						(x) => x.toLowerCase() === k.toLowerCase(),
					)
					if (hit) {
						const m = String(snap[hit])
							.replace(/[,%₹]/g, "")
							.match(/-?\d+\.?\d*/)
						if (m) return +m[0]
					}
				}
				return null
			}

			function render(d) {
				const snap = d.snapshot || {},
					comp = d.computed || {}
				const staleTxt = d.stale
					? `<span class="stale">· stale, consider refresh</span>`
					: ""
				let html = `<h2 class="page">${d.symbol}</h2>
     <div class="sub">${snap["Name"] || ""} · ${d.variant} · fetched ${d.fetched_at} ${staleTxt}</div>`

				// 52-week range (from screener "High / Low" + "Current Price")
				const cp = snapNum(snap, "Current Price")
				let hi = null,
					lo = null
				const hlKey = Object.keys(snap).find((k) =>
					/high\s*\/\s*low/i.test(k),
				)
				if (hlKey) {
					const nums = String(snap[hlKey]).match(/-?\d[\d,]*\.?\d*/g)
					if (nums && nums.length >= 2) {
						hi = +nums[0].replace(/,/g, "")
						lo = +nums[1].replace(/,/g, "")
					}
				}
				if (hi != null && lo != null && cp != null && hi > lo) {
					const pct = Math.min(
						100,
						Math.max(0, ((cp - lo) / (hi - lo)) * 100),
					)
					html += `<div class="range52"><div class="sub">52-week range</div>
      <div class="track"><div class="fill" style="width:100%"></div>
        <div class="mark" style="left:${pct}%"></div></div>
      <div class="ends"><span>L ${f(lo)}</span><span>₹${f(cp)} (${pct.toFixed(0)}%)</span><span>H ${f(hi)}</span></div></div>`
				}

				// snapshot cards (screener top-ratios)
				const snapEntries = Object.entries(snap).filter(
					([k]) => k.toLowerCase() !== "name",
				)
				html +=
					`<div class="sub" style="margin-top:14px">Screener snapshot</div><div class="cards">` +
					snapEntries
						.map(
							([k, v]) =>
								`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`,
						)
						.join("") +
					`</div>`

				// our computed ratios
				const compEntries = Object.entries(comp)
				if (compEntries.length) {
					html +=
						`<div class="sub">Our ratios <span style="color:var(--dim)">(computed from raw statements)</span></div><div class="cards">` +
						compEntries
							.map(
								([k, v]) =>
									`<div class="card"><div class="k">${k}</div><div class="v">${f(v)}</div></div>`,
							)
							.join("") +
						`</div>`
				}

				// statement tabs + tables
				const st = d.statements || {}
				const order = [
					"quarters",
					"profit-loss",
					"balance-sheet",
					"ratios",
					"cash-flow",
				]
				const LABEL = {
					quarters: "Quarterly",
					"profit-loss": "P&L (annual)",
					"balance-sheet": "Balance sheet",
					ratios: "Ratios",
					"cash-flow": "Cash flow",
				}
				const secs = order.filter((s) => st[s] && st[s].periods.length)
				if (secs.length) {
					html +=
						`<div class="tabs" id="tabs">` +
						secs
							.map(
								(s, i) =>
									`<button data-s="${s}" class="${i === 0 ? "on" : ""}">${LABEL[s] || s}</button>`,
							)
							.join("") +
						`</div><div id="stmt"></div>`
				}
				$("#body").innerHTML = html

				if (secs.length) {
					const draw = (s) => {
						const t = st[s]
						$("#stmt").innerHTML =
							`<div class="tbl-wrap"><table class="stmt">
        <thead><tr><th>₹ Cr / ratio</th>${t.periods.map((p) => `<th>${p}</th>`).join("")}</tr></thead>
        <tbody>${Object.entries(t.rows)
			.map(
				([label, vals]) =>
					`<tr><td>${label}</td>${vals.map((v) => `<td>${f(v)}</td>`).join("")}</tr>`,
			)
			.join("")}
        </tbody></table></div>`
					}
					$("#tabs")
						.querySelectorAll("button")
						.forEach(
							(b) =>
								(b.onclick = () => {
									$("#tabs .on")?.classList.remove("on")
									b.classList.add("on")
									draw(b.dataset.s)
								}),
						)
					draw(secs[0])
				}
			}

			// ---- boot --------------------------------------------------------------
			;(async () => {
				const s = await (await fetch("/api/session")).json()
				if (!s.kite.startsWith("valid"))
					status("no Kite session (fundamentals still work) ")
			})()
			const q0 = new URLSearchParams(location.search).get("symbol")
			if (q0) pick(q0)
			else
				$("#body").innerHTML =
					'<div class="empty">Search a stock above to see its full fundamentals.</div>'
		</script>
	</body>
</html>
