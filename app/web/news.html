<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>TickerForge · News</title>
		<meta name="theme-color" content="#0b0e13" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
		<link rel="stylesheet" href="/app.css" />
		<script src="/ui.js"></script>
	</head>
	<body>
		<div id="nav" data-page="news">
			<span class="brand">TickerForge</span>
			<a class="tab" href="/board">Board</a>
			<a class="tab" href="/">Chart</a>
			<a class="tab" href="/desk">Desk</a>
			<a class="tab" href="/scanner">Scanner</a>
			<a class="tab" href="/screen">Screen</a>
			<a class="tab" href="/query">Query</a>
			<a class="tab" href="/fundamentals">Fundamentals</a>
			<a class="tab" href="/results">Results</a>
			<a class="tab" href="/valuation">Valuation</a>
			<a class="tab" href="/metrics">Metrics</a>
			<a class="tab on" href="/news">News</a>
			<a class="tab" href="/actions">Corporate Actions</a>
			<a class="tab" href="/portfolio">Portfolio</a>
			<a class="tab" href="/paper">Paper</a>
			<a class="tab" href="/journal">Journal</a>
			<a class="tab" href="/backtest">Backtest</a>
			<a class="tab" href="/settings">Settings</a>
			<span class="sp"></span>
			<span class="status" id="status"></span>
		</div>
		<script>TF.shell()</script>
		<div class="wrap">
			<div class="page-head">
				<div>
					<h2 class="page">Watchlist news</h2>
					<div class="sub" id="meta">Headlines for every stock on your watchlist, newest first.</div>
				</div>
				<div class="spacer"></div>
				<div class="seg" id="hours" aria-label="Window">
					<button type="button" data-v="24">24h</button>
					<button type="button" data-v="48" class="on" aria-pressed="true">48h</button>
					<button type="button" data-v="72">72h</button>
					<button type="button" data-v="168">7d</button>
				</div>
				<button type="button" class="btn" id="reload"></button>
			</div>
			<div class="row" id="jump" style="margin-bottom: var(--s3)"></div>
			<div id="body"></div>
		</div>

		<script>
			"use strict"
			const $ = (s) => document.querySelector(s)
			const status = (m) => {
				$("#status").textContent = m || ""
			}
			const esc = TF.esc
			let hours = "48"
			$("#reload").innerHTML = TF.icon("refresh") + "Refresh"

			function fmtWhen(iso) {
				if (!iso) return ""
				const d = new Date(iso)
				if (isNaN(d)) return ""
				return TF.ago(d.getTime())
			}

			async function load() {
				status("fetching…")
				$("#jump").innerHTML = ""
				$("#body").innerHTML = Array.from(
					{ length: 3 },
					() => `<div class="block">${TF.skeleton(1, "lg")}${TF.skeleton(4)}</div>`,
				).join("")
				$("#reload").disabled = true
				try {
					const r = await fetch(`/api/news?hours=${hours}`)
					const d = await r.json()
					if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`)
					const groups = d.grouped || {}
					const syms = Object.keys(groups)
					const total = syms.reduce((n, s) => n + groups[s].length, 0)
					$("#meta").innerHTML =
						`<span class="mono">${total}</span> stories across <span class="mono">${syms.length}/${(d.watchlist || []).length}</span> watchlist stocks · last ${hours}h`

					let html = ""
					if (d.errors && d.errors.length)
						html += `<div class="notice">Couldn't fetch ${d.errors.length} stock(s): ${esc(d.errors.join(" · "))}</div>`
					if (!syms.length) {
						html += TF.empty(
							`No fresh stories in the last ${hours}h`,
							(d.watchlist || []).length
								? ""
								: "Your watchlist is empty — add stocks from the chart page.",
							"news",
						)
					} else {
						$("#jump").innerHTML = syms
							.map((s) => `<a class="chip mono" href="#n-${esc(s)}">${esc(s)} <span class="faint">${groups[s].length}</span></a>`)
							.join("")
						for (const sym of syms) {
							html +=
								`<section class="block" id="n-${esc(sym)}"><h3><span class="mono">${esc(sym)}</span>
          <span class="chip mono">${groups[sym].length}</span></h3>` +
								groups[sym]
									.map(
										(it) => `<div class="item">
            <div class="t">${it.link ? `<a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title)}</a>` : esc(it.title)}</div>
            <div class="m row" style="gap:6px">${it.source ? `<span class="chip">${esc(it.source)}</span>` : ""}${it.published ? `<span class="chip mono" title="${esc(it.published)}">${fmtWhen(it.published)}</span>` : ""}</div>
          </div>`,
									)
									.join("") +
								`</section>`
						}
					}
					$("#body").innerHTML = html
					status("")
				} catch (e) {
					status("error")
					$("#body").innerHTML = ""
					$("#body").appendChild(TF.errorBox(`Couldn't load news: ${e.message}`, load))
				} finally {
					$("#reload").disabled = false
				}
			}

			$("#reload").onclick = load
			TF.seg($("#hours"), (v) => {
				hours = v
				load()
			})
			load()
		</script>
	</body>
</html>
