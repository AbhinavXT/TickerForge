<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>TickerForge · News</title>
		<link rel="stylesheet" href="/app.css" />
	</head>
	<body>
		<div id="nav">
			<span class="brand">TickerForge</span>
			<a class="tab" href="/">Chart</a>
			<a class="tab" href="/desk">Desk</a>
			<a class="tab" href="/portfolio">Portfolio</a>
			<a class="tab" href="/scanner">Scanner</a>
			<a class="tab" href="/screen">Screen</a>
			<a class="tab" href="/query">Query</a>
			<a class="tab" href="/fundamentals">Fundamentals</a>
			<a class="tab" href="/results">Results</a>
			<a class="tab" href="/valuation">Valuation</a>
			<a class="tab" href="/backtest">Backtest</a>
			<a class="tab" href="/journal">Journal</a>
			<a class="tab" href="/metrics">Metrics</a>
			<a class="tab" href="/paper">Paper</a>
			<a class="tab on" href="/news">News</a>
			<a class="tab" href="/actions">Corporate Actions</a>
			<a class="tab" href="/settings">Settings</a>
			<span class="sp"></span>
			<span class="status" id="status"></span>
		</div>
		<div class="wrap">
			<div class="row">
				<h2 class="page">Watchlist news</h2>
				<div class="spacer"></div>
				<label class="sub">Window</label>
				<select class="sel" id="hours">
					<option value="24">24h</option>
					<option value="48" selected>48h</option>
					<option value="72">72h</option>
					<option value="168">7d</option>
				</select>
				<button class="btn primary" id="reload">Refresh</button>
			</div>
			<div class="sub" id="meta" style="margin-top: 4px"></div>
			<div id="body"></div>
		</div>

		<script>
			"use strict"
			const $ = (s) => document.querySelector(s)
			const status = (m) => {
				$("#status").textContent = m || ""
			}

			function fmtWhen(iso) {
				if (!iso) return ""
				const d = new Date(iso)
				if (isNaN(d)) return ""
				const mins = Math.round((Date.now() - d) / 60000)
				if (mins < 60) return `${mins}m ago`
				if (mins < 1440) return `${Math.round(mins / 60)}h ago`
				return `${Math.round(mins / 1440)}d ago`
			}
			const esc = (s) =>
				(s || "").replace(
					/[&<>]/g,
					(c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c],
				)

			async function load() {
				const hours = $("#hours").value
				status("fetching…")
				$("#body").innerHTML =
					'<div class="loading">Fetching latest news across your watchlist… this can take a few seconds.</div>'
				$("#reload").disabled = true
				try {
					const d = await (
						await fetch(`/api/news?hours=${hours}`)
					).json()
					const groups = d.grouped || {}
					const syms = Object.keys(groups)
					const total = syms.reduce((n, s) => n + groups[s].length, 0)
					$("#meta").textContent =
						`${total} stories across ${syms.length}/${(d.watchlist || []).length} watchlist stocks · last ${hours}h`

					let html = ""
					if (d.errors && d.errors.length)
						html += `<div class="notice">Couldn't fetch ${d.errors.length} stock(s): ${esc(d.errors.join(" · "))}</div>`
					if (!syms.length) {
						html += `<div class="empty">No fresh stories in the last ${hours}h.${
							(d.watchlist || []).length
								? ""
								: " Your watchlist is empty — add stocks from the chart page."
						}</div>`
					} else {
						for (const sym of syms) {
							html +=
								`<div class="block"><h3>${sym}
          <span class="badge">${groups[sym].length}</span></h3>` +
								groups[sym]
									.map(
										(it) => `<div class="item">
            <div class="t">${it.link ? `<a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title)}</a>` : esc(it.title)}</div>
            <div class="m">${esc(it.source || "")}${it.source && it.published ? " · " : ""}${fmtWhen(it.published)}</div>
          </div>`,
									)
									.join("") +
								`</div>`
						}
					}
					$("#body").innerHTML = html
					status("")
				} catch (e) {
					status("error")
					$("#body").innerHTML =
						`<div class="empty">error: ${esc(e.message)}</div>`
				} finally {
					$("#reload").disabled = false
				}
			}

			$("#reload").onclick = load
			$("#hours").onchange = load
			load()
		</script>
	</body>
</html>
